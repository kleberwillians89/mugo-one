project_id = "ruah-intelligence"

[auth]
site_url = "https://crmruahparfums.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "https://crmruahparfums.vercel.app/auth/callback",
]
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.process-import]
verify_jwt = true
[functions.confirm-import]
verify_jwt = true
[functions.revert-import]
verify_jwt = true
[functions.generate-insights]
verify_jwt = true
[functions.ask-intelligence]
verify_jwt = true
[functions.recalculate-metrics]
verify_jwt = true
[functions.superfrete-quote]
verify_jwt = true
[functions.superfrete-create-label]
verify_jwt = true
[functions.superfrete-sync-shipment]
verify_jwt = true
