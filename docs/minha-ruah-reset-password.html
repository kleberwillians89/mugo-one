<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redefina sua senha do Minha RUAH</title>
  </head>
  <body style="margin:0;padding:0;background:#F5F2EC;color:#191713;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#F5F2EC">
      <tr>
        <td align="center" style="padding:40px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#FFFFFF;border:1px solid #E5DED2">
            <tr>
              <td align="center" style="padding:42px 28px 24px;border-bottom:1px solid #E9E2D7">
                <div style="font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:30px;letter-spacing:5px;color:#191713">RUAH</div>
                <div style="margin-top:8px;font-size:10px;line-height:16px;letter-spacing:3px;color:#A37D2C">PARFUMS · MINHA RUAH</div>
              </td>
            </tr>
            <tr>
              <td style="padding:42px 42px 38px">
                <h1 style="margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;font-size:27px;line-height:36px;font-weight:normal;color:#191713">Redefina sua senha</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:25px;color:#25211C">Recebemos uma solicitação para redefinir a senha do seu acesso ao Minha RUAH.</p>
                <p style="margin:0 0 30px;font-size:14px;line-height:24px;color:#665F54">Use o botão abaixo para criar uma nova senha.</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#191713" style="border-radius:5px">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;min-width:220px;padding:16px 24px;font-size:12px;line-height:16px;font-weight:bold;letter-spacing:1px;text-align:center;text-decoration:none;color:#FFFFFF">REDEFINIR MINHA SENHA</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:12px;line-height:20px;color:#7B7367">Se você não solicitou essa alteração, pode ignorar este e-mail.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:25px 42px;background:#FAF8F4;border-top:1px solid #E9E2D7">
                <div style="font-family:Georgia,'Times New Roman',serif;font-size:15px;letter-spacing:2px;color:#191713">RUAH PARFUMS</div>
                <div style="margin-top:6px;font-size:10px;letter-spacing:1px;color:#9A7627">ATENDIMENTO EXCLUSIVO</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
